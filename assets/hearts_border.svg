  <g transform='translate(60, 0)'><path d='M 15 6 C 15 6, 6 15, 6 21 C 6 26, 11 28, 15 24 C 19 28, 24 26, 24 21 C 24 15, 15 6, 15 6 Z' fill='#FF99A8'/></g>

  <!-- Bottom Edge (30 to 90, 90 to 120) -->
  <g transform='translate(30, 90) rotate(180 15 15)'><path d='M 15 6 C 15 6, 6 15, 6 21 C 6 26, 11 28, 15 24 C 19 28, 24 26, 24 21 C 24 15, 15 6, 15 6 Z' fill='#C1121F'/></g>
  <g transform='translate(60, 90) rotate(180 15 15)'><path d='M 15 6 C 15 6, 6 15, 6 21 C 6 26, 11 28, 15 24 C 19 28, 24 26, 24 21 C 24 15, 15 6, 15 6 Z' fill='#FF99A8'/></g>

  <!-- Left Edge (0 to 30, 30 to 90) -->
  <g transform='translate(0, 30) rotate(-90 15 15)'><path d='M 15 6 C 15 6, 6 15, 6 21 C 6 26, 11 28, 15 24 C 19 28, 24 26, 24 21 C 24 15, 15 6, 15 6 Z' fill='#C1121F'/></g>
  <g transform='translate(0, 60) rotate(-90 15 15)'><path d='M 15 6 C 15 6, 6 15, 6 21 C 6 26, 11 28, 15 24 C 19 28, 24 26, 24 21 C 24 15, 15 6, 15 6 Z' fill='#FF99A8'/></g>

