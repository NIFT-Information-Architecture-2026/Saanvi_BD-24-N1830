  <g transform='translate(90, 60) rotate(90 15 15)'><path d='M 15 6 C 15 6, 6 15, 6 21 C 6 26, 11 28, 15 24 C 19 28, 24 26, 24 21 C 24 15, 15 6, 15 6 Z' fill='#FF99A8'/></g>
