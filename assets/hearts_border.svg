<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'>
  <!-- Background is transparent here so it blends if needed, but cream is safer -->
  <rect width='120' height='120' fill='#FFF9F4'/>
  
  <!-- Corners 30x30 -->
  <g transform='translate(0, 0) rotate(-45 15 15)'><path d='M 15 6 C 15 6, 6 15, 6 21 C 6 26, 11 28, 15 24 C 19 28, 24 26, 24 21 C 24 15, 15 6, 15 6 Z' fill='#C1121F'/></g>
